# Application URL
base.url=https://the-internet.herokuapp.com/

# Browser Configuration
browser=chrome

# Timeouts (in seconds)
implicit.wait=10
explicit.wait=20
page.load.timeout=30

# Driver Paths
chrome.driver.path=drivers/chromedriver.exe
firefox.driver.path=drivers/geckodriver.exe

# Logging and Reporting
log.level=INFO
log.file.path=logs/automation.log

# Test Data
test.data.path=src/test/resources/testdata.xlsx
